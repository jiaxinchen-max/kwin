<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="190" viewBox="0 0 1620 190" role="img" aria-labelledby="title desc">
  <title id="title">Input to client flow</title>
  <desc id="desc">Input event path to focused Wayland surface or KWin action.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f5f7f"/>
    </marker>
    <style>
      .box { fill: #f8fbff; stroke: #3f5f7f; stroke-width: 1.6; rx: 8; }
      .text { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; text-anchor: middle; dominant-baseline: middle; }
      .arrow { stroke: #3f5f7f; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102a43; text-anchor: middle; }
    </style>
  </defs>
  <text x="810" y="28" class="label">Input To Client</text>
  <g transform="translate(24 70)">
    <rect class="box" width="220" height="58"/>
    <text x="110" y="20" class="text">libinput / nested</text>
    <text x="110" y="36" class="text">Android / fake input</text>
  </g>
  <path class="arrow" d="M244 99 L274 99"/>
  <g transform="translate(274 70)">
    <rect class="box" width="160" height="58"/>
    <text x="80" y="29" class="text">InputDevice</text>
  </g>
  <path class="arrow" d="M434 99 L464 99"/>
  <g transform="translate(464 70)">
    <rect class="box" width="190" height="58"/>
    <text x="95" y="29" class="text">InputRedirection</text>
  </g>
  <path class="arrow" d="M654 99 L684 99"/>
  <g transform="translate(684 70)">
    <rect class="box" width="190" height="58"/>
    <text x="95" y="22" class="text">Specific</text>
    <text x="95" y="38" class="text">redirection</text>
  </g>
  <path class="arrow" d="M874 99 L904 99"/>
  <g transform="translate(904 70)">
    <rect class="box" width="130" height="58"/>
    <text x="65" y="29" class="text">Spies</text>
  </g>
  <path class="arrow" d="M1034 99 L1064 99"/>
  <g transform="translate(1064 70)">
    <rect class="box" width="130" height="58"/>
    <text x="65" y="29" class="text">Filters</text>
  </g>
  <path class="arrow" d="M1194 99 L1224 99"/>
  <g transform="translate(1224 70)">
    <rect class="box" width="160" height="58"/>
    <text x="80" y="29" class="text">SeatInterface</text>
  </g>
  <path class="arrow" d="M1384 99 L1414 99"/>
  <g transform="translate(1414 70)">
    <rect class="box" width="180" height="58"/>
    <text x="90" y="20" class="text">Focused surface</text>
    <text x="90" y="36" class="text">or KWin action</text>
  </g>
</svg>
