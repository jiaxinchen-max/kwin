<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="190" viewBox="0 0 1420 190" role="img" aria-labelledby="title desc">
  <title id="title">Output configuration flow</title>
  <desc id="desc">Output configuration path from KCM or sensors to Wayland output globals and compositor views.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f5f7f"/>
    </marker>
    <style>
      .box { fill: #f8fbff; stroke: #3f5f7f; stroke-width: 1.6; rx: 8; }
      .text { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; text-anchor: middle; dominant-baseline: middle; }
      .arrow { stroke: #3f5f7f; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102a43; text-anchor: middle; }
    </style>
  </defs>
  <text x="710" y="28" class="label">Output Configuration</text>
  <g transform="translate(24 70)">
    <rect class="box" width="220" height="58"/>
    <text x="110" y="20" class="text">KCM / output-management</text>
    <text x="110" y="36" class="text">sensors</text>
  </g>
  <path class="arrow" d="M244 99 L274 99"/>
  <g transform="translate(274 70)">
    <rect class="box" width="220" height="58"/>
    <text x="110" y="22" class="text">Workspace::</text>
    <text x="110" y="38" class="text">applyOutputConfiguration</text>
  </g>
  <path class="arrow" d="M494 99 L524 99"/>
  <g transform="translate(524 70)">
    <rect class="box" width="220" height="58"/>
    <text x="110" y="22" class="text">OutputBackend::</text>
    <text x="110" y="38" class="text">applyOutputChanges</text>
  </g>
  <path class="arrow" d="M744 99 L774 99"/>
  <g transform="translate(774 70)">
    <rect class="box" width="210" height="58"/>
    <text x="105" y="22" class="text">BackendOutput::</text>
    <text x="105" y="38" class="text">applyChanges</text>
  </g>
  <path class="arrow" d="M984 99 L1014 99"/>
  <g transform="translate(1014 70)">
    <rect class="box" width="170" height="58"/>
    <text x="85" y="22" class="text">Workspace</text>
    <text x="85" y="38" class="text">outputsChanged</text>
  </g>
  <path class="arrow" d="M1184 99 L1214 99"/>
  <g transform="translate(1214 70)">
    <rect class="box" width="180" height="58"/>
    <text x="90" y="20" class="text">Wayland globals</text>
    <text x="90" y="36" class="text">Compositor views</text>
  </g>
</svg>
