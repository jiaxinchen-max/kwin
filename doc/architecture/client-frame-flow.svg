<svg xmlns="http://www.w3.org/2000/svg" width="1820" height="190" viewBox="0 0 1820 190" role="img" aria-labelledby="title desc">
  <title id="title">Client frame to display flow</title>
  <desc id="desc">Wayland client frame path from surface commit to backend present.</desc>
  <defs>
