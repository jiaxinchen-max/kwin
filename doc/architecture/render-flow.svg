<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
  <title id="title">KWin render flow</title>
  <desc id="desc">Frame rendering sequence from RenderLoop to backend presentation feedback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f5f7f"/>
    </marker>
    <style>
      .box { fill: #f8fbff; stroke: #3f5f7f; stroke-width: 1.6; rx: 8; }
      .text { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; text-anchor: middle; dominant-baseline: middle; }
      .arrow { stroke: #3f5f7f; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102a43; text-anchor: middle; }
    </style>
  </defs>
  <text x="450" y="28" class="label">Render Flow</text>
  <g transform="translate(280 54)">
    <rect class="box" width="340" height="48"/>
    <text x="170" y="24" class="text">RenderLoop::frameRequested</text>
  </g>
  <path class="arrow" d="M450 102 L450 128"/>
  <g transform="translate(280 128)">
    <rect class="box" width="340" height="48"/>
    <text x="170" y="24" class="text">Compositor::composite</text>
  </g>
  <path class="arrow" d="M450 176 L450 202"/>
  <g transform="translate(280 202)">
    <rect class="box" width="340" height="48"/>
    <text x="170" y="24" class="text">SceneView / ItemView</text>
  </g>
  <path class="arrow" d="M450 250 L450 276"/>
  <g transform="translate(280 276)">
    <rect class="box" width="340" height="48"/>
    <text x="170" y="24" class="text">OutputLayer::beginFrame</text>
  </g>
  <path class="arrow" d="M450 324 L450 350"/>
  <g transform="translate(280 350)">
    <rect class="box" width="340" height="48"/>
    <text x="170" y="24" class="text">WorkspaceScene::paint</text>
  </g>
  <path class="arrow" d="M450 398 L450 424"/>
  <g transform="translate(280 424)">
    <rect class="box" width="340" height="48"/>
    <text x="170" y="24" class="text">EffectsHandler paint chain</text>
  </g>
  <path class="arrow" d="M450 472 L450 498"/>
  <g transform="translate(280 498)">
    <rect class="box" width="340" height="48"/>
    <text x="170" y="24" class="text">ItemRendererOpenGL / QPainter</text>
  </g>
  <path class="arrow" d="M450 546 L450 572"/>
  <g transform="translate(280 572)">
    <rect class="box" width="340" height="48"/>
    <text x="170" y="24" class="text">OutputLayer::endFrame</text>
  </g>
  <path class="arrow" d="M450 620 L450 646"/>
  <g transform="translate(280 646)">
    <rect class="box" width="340" height="48"/>
    <text x="170" y="17" class="text">Backend present / page flip</text>
    <text x="170" y="33" class="text">OutputFrame feedback</text>
  </g>
</svg>
