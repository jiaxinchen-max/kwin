<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">KWin input flow</title>
  <desc id="desc">Input event path from platform input backend to seat, workspace, effects, and shortcuts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f5f7f"/>
    </marker>
    <style>
      .box { fill: #f8fbff; stroke: #3f5f7f; stroke-width: 1.6; rx: 8; }
      .text { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; text-anchor: middle; dominant-baseline: middle; }
      .arrow { stroke: #3f5f7f; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102a43; text-anchor: middle; }
    </style>
  </defs>
  <text x="450" y="28" class="label">Input Flow</text>
  <g transform="translate(275 54)">
    <rect class="box" width="350" height="48"/>
    <text x="175" y="24" class="text">InputBackend</text>
  </g>
  <path class="arrow" d="M450 102 L450 128"/>
  <g transform="translate(275 128)">
    <rect class="box" width="350" height="48"/>
    <text x="175" y="24" class="text">InputDevice signals</text>
  </g>
  <path class="arrow" d="M450 176 L450 202"/>
  <g transform="translate(275 202)">
    <rect class="box" width="350" height="48"/>
    <text x="175" y="24" class="text">InputRedirection::addInputDevice</text>
  </g>
  <path class="arrow" d="M450 250 L450 276"/>
  <g transform="translate(275 276)">
    <rect class="box" width="350" height="48"/>
    <text x="175" y="24" class="text">Keyboard / Pointer / Touch / Tablet</text>
  </g>
  <path class="arrow" d="M450 324 L450 350"/>
  <g transform="translate(275 350)">
    <rect class="box" width="350" height="48"/>
    <text x="175" y="24" class="text">InputEventSpy list</text>
  </g>
  <path class="arrow" d="M450 398 L450 424"/>
  <g transform="translate(275 424)">
    <rect class="box" width="350" height="48"/>
    <text x="175" y="24" class="text">InputEventFilter ordered chain</text>
  </g>
  <path class="arrow" d="M450 472 L450 498"/>
  <g transform="translate(275 498)">
    <rect class="box" width="350" height="48"/>
    <text x="175" y="17" class="text">Wayland Seat / Workspace</text>
    <text x="175" y="33" class="text">Effects / Shortcuts</text>
  </g>
</svg>
