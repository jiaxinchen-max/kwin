<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">KWin startup flow</title>
  <desc id="desc">kwin_wayland startup sequence from main to optional Xwayland and session applications.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f5f7f"/>
    </marker>
    <style>
      .box { fill: #f8fbff; stroke: #3f5f7f; stroke-width: 1.6; rx: 8; }
      .text { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; text-anchor: middle; dominant-baseline: middle; }
      .arrow { stroke: #3f5f7f; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102a43; text-anchor: middle; }
    </style>
  </defs>
  <text x="450" y="28" class="label">Startup Flow</text>
  <g transform="translate(290 52)">
    <rect class="box" width="320" height="48"/>
    <text x="160" y="24" class="text">main() in src/main_wayland.cpp</text>
  </g>
  <path class="arrow" d="M450 100 L450 128"/>
  <g transform="translate(290 128)">
    <rect class="box" width="320" height="48"/>
    <text x="160" y="24" class="text">ApplicationWayland</text>
  </g>
  <path class="arrow" d="M450 176 L450 204"/>
  <g transform="translate(290 204)">
    <rect class="box" width="320" height="48"/>
    <text x="160" y="24" class="text">parse CLI / choose backend</text>
  </g>
  <path class="arrow" d="M450 252 L450 280"/>
  <g transform="translate(290 280)">
    <rect class="box" width="320" height="48"/>
    <text x="160" y="24" class="text">set OutputBackend</text>
  </g>
  <path class="arrow" d="M450 328 L450 356"/>
  <g transform="translate(290 356)">
    <rect class="box" width="320" height="48"/>
    <text x="160" y="24" class="text">WaylandServer::create/init</text>
  </g>
  <path class="arrow" d="M450 404 L450 432"/>
  <g transform="translate(290 432)">
    <rect class="box" width="320" height="48"/>
    <text x="160" y="24" class="text">Application::start</text>
  </g>
  <path class="arrow" d="M450 480 L450 508"/>
  <g transform="translate(290 508)">
    <rect class="box" width="320" height="48"/>
    <text x="160" y="24" class="text">OutputBackend::initialize</text>
  </g>
  <path class="arrow" d="M450 556 L450 584"/>
  <g transform="translate(290 584)">
    <rect class="box" width="320" height="48"/>
    <text x="160" y="24" class="text">InputRedirection::create/init</text>
  </g>
  <path class="arrow" d="M450 632 L450 660"/>
  <g transform="translate(290 660)">
    <rect class="box" width="320" height="48"/>
    <text x="160" y="24" class="text">Compositor::create/createRenderer</text>
  </g>
  <path class="arrow" d="M450 708 L450 736"/>
  <g transform="translate(290 736)">
    <rect class="box" width="320" height="48"/>
    <text x="160" y="24" class="text">Workspace::Workspace</text>
  </g>
  <path class="arrow" d="M450 784 L450 812"/>
  <g transform="translate(290 812)">
    <rect class="box" width="320" height="48"/>
    <text x="160" y="17" class="text">PluginManager -> Compositor::start</text>
    <text x="160" y="33" class="text">WaylandServer::start -> session apps</text>
  </g>
</svg>
